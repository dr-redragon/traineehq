<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HST Training Hub | NHS Higher Specialty Training Resources</title>
    <meta name="description" content="A secure, centralised hub of curricula, exam preparation, operative videos and key contacts for NHS Higher Surgical and Medical Specialty Trainees." />
    <meta name="author" content="HST Training Hub" />

    <!-- GitHub Pages cannot send custom response headers, so the two security
         headers netlify.toml used to set are declared here instead. This is a
         sign-in page for a private tool: keep it out of search results. The
         crawler is deliberately still allowed in by robots.txt, because a
         disallowed page is never fetched and so its noindex is never read. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:title" content="HST Training Hub | NHS Higher Specialty Training Resources" />
    <meta property="og:description" content="Curricula, exam preparation, operative videos and key contacts for NHS Higher Specialty Trainees — all in one secure platform." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />


    <!-- The theme and the accent scheme, both applied before first paint.

         Inline and synchronous on purpose: a module script would run too late.

         next-themes cannot do the dark half of this on its own here. In a Next
         app it injects a blocking script into the served HTML; in a Vite SPA
         the served HTML is a near-empty shell and its script is part of the
         React tree, so it cannot run until the bundle has downloaded, parsed
         and mounted. Until then <html> carries no `dark` class and the page
         paints the light tokens — measured at roughly 800ms of light frames on
         a 6x-throttled CPU before flipping. That is the "random flicker": the
         window is imperceptible on a fast machine with a warm cache and very
         visible on a slow one, so the same person sees it only sometimes.

         next-themes agrees with whatever this sets, so it has nothing to
         change on mount and there is no second flip. Both halves are
         deliberately defensive: if storage throws or the value is junk, the
         default stands rather than the page breaking.

         The keys match: "theme" is next-themes' default storageKey, and
         SCHEME_STORAGE_KEY lives in src/lib/colorSchemes.ts. -->
    <script>
      (function () {
        var root = document.documentElement;

        // Light or dark. "system" is the default, matching the ThemeProvider.
        try {
          var stored = localStorage.getItem("theme") || "system";
          var dark = stored === "dark" || (stored === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) root.classList.add("dark");
          // Tells the browser to draw its own furniture — scrollbars, form
          // controls, the canvas behind the page — to match, so those do not
          // flash white while the rest of the page is already dark.
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) { /* no storage or no matchMedia: light stands */ }

        // Keep in step with DEFAULT_SCHEME in src/lib/colorSchemes.ts. The
        // default has to be named here as well as there: the base :root tokens
        // are the design's own red, so a first-time visitor with nothing stored
        // would paint red and then repaint into the default a frame later —
        // exactly the flash this script exists to prevent.
        var fallback = "sky";
        var name = fallback;
        try {
          var s = localStorage.getItem("traineehq-color-scheme");
          if (s && /^[a-z]+$/.test(s)) name = s;
        } catch (e) { /* no storage: the default stands */ }
        root.classList.add("scheme-" + name);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
