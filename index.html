<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HST Training Hub | NHS Higher Specialty Training Resources</title>
    <meta name="description" content="A secure, centralised hub of curricula, exam preparation, operative videos and key contacts for NHS Higher Surgical and Medical Specialty Trainees." />
    <meta name="author" content="HST Training Hub" />

    <!-- GitHub Pages cannot send custom response headers, so the two security
         headers netlify.toml used to set are declared here instead. This is a
         sign-in page for a private tool: keep it out of search results. The
         crawler is deliberately still allowed in by robots.txt, because a
         disallowed page is never fetched and so its noindex is never read. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:title" content="HST Training Hub | NHS Higher Specialty Training Resources" />
    <meta property="og:description" content="Curricula, exam preparation, operative videos and key contacts for NHS Higher Specialty Trainees — all in one secure platform." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />


    <!-- The accent scheme, applied before first paint.

         Without this the page renders in the default red and then repaints
         into the chosen colour a frame later, which is the same flash
         next-themes solves the same way for light/dark. It is inline and
         synchronous on purpose: a module script would run too late.

         Kept deliberately small and defensive — an unknown or missing value,
         or storage being unavailable, simply leaves the default in place. The
         key matches SCHEME_STORAGE_KEY in src/lib/colorSchemes.ts. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("traineehq-color-scheme");
          if (s && /^[a-z]+$/.test(s)) document.documentElement.classList.add("scheme-" + s);
        } catch (e) { /* no storage: the default scheme stands */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
