<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HST Training Hub | NHS Higher Specialty Training Resources</title>
    <meta name="description" content="A secure, centralised hub of curricula, exam preparation, operative videos and key contacts for NHS Higher Surgical and Medical Specialty Trainees." />
    <meta name="author" content="HST Training Hub" />

    <!-- GitHub Pages cannot send custom response headers, so the two security
         headers netlify.toml used to set are declared here instead. This is a
         sign-in page for a private tool: keep it out of search results. The
         crawler is deliberately still allowed in by robots.txt, because a
         disallowed page is never fetched and so its noindex is never read. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:title" content="HST Training Hub | NHS Higher Specialty Training Resources" />
    <meta property="og:description" content="Curricula, exam preparation, operative videos and key contacts for NHS Higher Specialty Trainees — all in one secure platform." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />


    <!-- The theme and the accent scheme, both applied before first paint.

         Inline and synchronous on purpose: a module script would run too late.
         The served HTML of a Vite SPA is a near-empty shell, so anything in
         the React tree cannot run until the bundle has downloaded, parsed and
         mounted. Until then <html> carries no `dark` class and the page paints
         the light tokens — measured at roughly 800ms of light frames on a
         6x-throttled CPU before flipping. The window is imperceptible on a
         fast machine with a warm cache and very visible on a slow one, so the
         same person sees it only sometimes.

         Both values are read from the browser copies, which are caches of what
         is on the account: the record is `profiles.theme` and
         `profiles.color_scheme`, which cannot be fetched before the page is
         drawn. src/hooks/useTheme.tsx and src/hooks/useColorScheme.ts
         reconcile the two the moment the profile lands, and normally have
         nothing to change.

         Both halves are deliberately defensive: if storage throws or the value
         is junk, the default stands rather than the page breaking.

         The keys match THEME_STORAGE_KEY in src/lib/theme.ts and
         SCHEME_STORAGE_KEY in src/lib/colorSchemes.ts. -->
    <script>
      (function () {
        var root = document.documentElement;

        // Light or dark. "system" is the default, matching DEFAULT_THEME. The
        // device is only consulted under "system": an explicit choice is final,
        // here and in the app, which is what stops the two disagreeing.
        try {
          var stored = localStorage.getItem("theme") || "system";
          var dark = stored === "dark" || (stored === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          // toggle, not add: the same idempotent write the app makes, so
          // nothing ever sees <html> between having the class and not.
          root.classList.toggle("dark", dark);
          // Tells the browser to draw its own furniture — scrollbars, form
          // controls, the canvas behind the page — to match, so those do not
          // flash white while the rest of the page is already dark.
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) { /* no storage or no matchMedia: light stands */ }

        // Keep in step with DEFAULT_SCHEME in src/lib/colorSchemes.ts. The
        // default has to be named here as well as there: the base :root tokens
        // are the design's own red, so a first-time visitor with nothing stored
        // would paint red and then repaint into the default a frame later —
        // exactly the flash this script exists to prevent.
        var fallback = "sky";
        var name = fallback;
        try {
          var s = localStorage.getItem("traineehq-color-scheme");
          if (s && /^[a-z]+$/.test(s)) name = s;
        } catch (e) { /* no storage: the default stands */ }
        root.classList.add("scheme-" + name);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
