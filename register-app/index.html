<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Register — attendance, check-in and certificates</title>
    <meta name="description" content="QR check-in, attendance, feedback and certificates for teaching programmes, conferences and courses. Free for single events." />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#201e1d" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:title" content="The Register" />
    <meta property="og:description" content="A register people sign themselves: QR check-in, attendance, feedback and certificates." />
    <meta property="og:type" content="website" />

    <!-- Light or dark, applied before first paint so the page never flashes the
         wrong one. It follows the device; there is no in-app switch. The
         `scheme-ink` class is the near-mono accent the register is drawn in. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("scheme-ink");
        try {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          var apply = function () {
            root.classList.toggle("dark", mq.matches);
            root.style.colorScheme = mq.matches ? "dark" : "light";
          };
          apply();
          mq.addEventListener("change", apply);
        } catch (e) { /* no matchMedia: light stands */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
