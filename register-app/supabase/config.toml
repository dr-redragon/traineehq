# JWT verification per function, kept here so the setting is reviewable in the
# repo rather than only in the dashboard. `supabase functions deploy` reads it.

# The register's API. Off because two of its actions are anonymous by design —
# somebody scanning a QR code has no account — and the function checks each
# caller itself: the session link for those two, register membership (and the
# plan) for every organiser action.
[functions.register-api]
verify_jwt = false

# Stripe sends no Supabase token. The function verifies Stripe's signature on
# the raw body before reading it.
[functions.stripe-webhook]
verify_jwt = false

[functions.register-certificate]
verify_jwt = true

[functions.register-invite]
verify_jwt = true

[functions.billing-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
