<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraineeHQ redesign preview</title>

    <!-- The accent scheme, applied before first paint.

         Without this the page renders in the default red and then repaints
         into the chosen colour a frame later, which is the same flash
         next-themes solves the same way for light/dark. It is inline and
         synchronous on purpose: a module script would run too late.

         Kept deliberately small and defensive — an unknown or missing value,
         or storage being unavailable, simply leaves the default in place. The
         key matches SCHEME_STORAGE_KEY in src/lib/colorSchemes.ts. -->
    <script>
      (function () {
        // Keep in step with DEFAULT_SCHEME in src/lib/colorSchemes.ts. The
        // default has to be named here as well as there: the base :root tokens
        // are the design's own red, so a first-time visitor with nothing stored
        // would paint red and then repaint into the default a frame later —
        // exactly the flash this script exists to prevent.
        var fallback = "sky";
        var name = fallback;
        try {
          var s = localStorage.getItem("traineehq-color-scheme");
          if (s && /^[a-z]+$/.test(s)) name = s;
        } catch (e) { /* no storage: the default stands */ }
        document.documentElement.classList.add("scheme-" + name);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
